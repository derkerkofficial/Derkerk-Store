<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derkerk | Admin Pro</title>
<style>
/* 사장님 원본 디자인 및 드래그 스타일 유지 */
:root { --bg-dark:#111; --text-dark:#eee; --hover-gray: #333; --accent-color: #fff; }

body { margin:0; background:var(--bg-dark); color:var(--text-dark); font-family:Arial,sans-serif; scroll-behavior: smooth; zoom: 0.8; }

header { 
    position:fixed; top:0; left:0; width:100%; z-index:1000; 
    padding:10px 32px; 
    display:flex; 
    align-items:center; 
    justify-content: space-between; 
    backdrop-filter:blur(8px); 
    background:rgba(18,18,18,0.9); 
    box-sizing:border-box; 
    border-bottom: 1px solid #333; 
}

.logo { font-size:1.8rem; font-weight:bold; text-decoration:none; color:inherit; }

nav { display:flex; align-items:center; gap:24px; margin-left: auto; } 
nav a { text-decoration:none; color:inherit; font-weight:600; font-size: 0.95rem; transition: color 0.2s; }
nav a:hover { color: #fff; }
nav button { padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:600; background:#fff; color:#111; border:none; }

main { max-width:1100px; margin:140px auto 40px; padding:0 24px; box-sizing: border-box; }
.card { background:#1a1a1a; padding:28px; border-radius:14px; margin-bottom:30px; border: 1px solid #222; }
h3 { margin-top:0; margin-bottom: 20px; font-size: 1.2rem; }
.list-header-row { display: flex; justify-content: flex-start; align-items: center; gap: 20px; margin-bottom: 20px; }
.search-box { width: 250px; }

.input-row { display: flex; gap: 10px; margin-bottom: 12px; width: 100%; }
#productName { flex: 3; } 
.price-input-unit { flex: 1; min-width: 0; } 

input[type="text"], input[type="number"], select, textarea { width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#111; color:#fff; box-sizing:border-box; outline: none; font-size: 0.95rem; font-family: inherit; }
textarea { height: 80px; resize: vertical; }

#finalPriceDisplay { display: flex; align-items: center; justify-content: center; background: #111; border: 1px solid #333; border-radius: 8px; color: #ff4d4d; font-weight: bold; font-size: 0.95rem; height: 46px; }
button { padding:10px 16px; border: none !important; border-radius:8px; background:#fff; color:#111; font-weight:700; cursor:pointer; transition: all 0.2s ease; font-size: 0.95rem; }
button:hover { background: var(--hover-gray) !important; color:#fff !important; }

/* 애니메이션 영역 스타일 */
#dynamicDetails {
    max-height: 0;
    overflow: hidden;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    pointer-events: none;
}

/* [수정] 이미지 컨테이너도 드래그 가능하게 커서 설정 */
.item-wrapper, .product-item, .image-container { cursor: grab !important; user-select: none; }
.item-wrapper:active, .product-item:active, .image-container:active { cursor: grabbing !important; }
.dragging { opacity: 0.4; border: 1px dashed #fff !important; }

.item-wrapper { display: inline-flex; align-items: center; background: #222; border-radius: 20px; padding: 0 14px; color: #eee; height: 38px; margin-right: 8px; }
.item-wrapper:hover { background: #333; }
.item-wrapper.active { background: #fff; color: #111; }

.clickable-text, .color-btn { font-weight: 600; font-size: 0.95rem; padding: 8px 0; border: none !important; background: none !important; color: inherit !important; cursor: pointer; text-align: left; }
.delete-x-btn { background: none !important; border: none !important; margin-left: 8px; font-size: 1rem; cursor: pointer; color: rgba(120, 120, 120, 0.5); padding: 0; }
.delete-x-btn:hover { color: #ff4d4d !important; background: none !important; }

.category-control, .color-control { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#categoryList, #colorList, #highlightList { display: flex; flex-wrap: wrap; gap: 8px 0; align-items: center; min-height: 40px; }

.product-item { background:#222; padding:18px; border-radius:12px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:16px; border: 1px solid #333; }
.product-info-main { font-weight: bold; color: #eee; }
.product-info-sub { color: #888; margin-top: 4px; display: block; font-size: 0.9rem; }

table { width:100%; border-collapse:collapse; margin-top:16px; background: #111; }
th, td { border:1px solid #333; padding:12px; text-align:center; font-size: 0.95rem; }
th { background:#222; color: #888; }
.save-area { display:flex; justify-content:flex-end; margin-top:16px; }
#saveNameBtn, #saveStockBtn { display:none; }
.category-checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding: 10px; background: #111; border-radius: 8px; border: 1px solid #333; }
.category-checkbox-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; }

/* [수정] 이미지 리스트 간격 및 드래그를 위한 이미지 컨테이너 스타일 */
#imageList img, #descImageList img { width:80px; height:80px; object-fit:cover; border-radius:8px; display: block; }
.image-container { position:relative; display:inline-block; transition: transform 0.2s; }

.delete-overlay { position:absolute; inset:0; background:rgba(255,0,0,0.4); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; font-size:0.9rem; border-radius:8px; cursor:pointer; z-index: 10; }
.image-container:hover .delete-overlay { opacity:1; }

.filter-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
.filter-btn { background: #222; color: #888; padding: 6px 14px; font-size: 0.85rem; border-radius: 20px; border: none; cursor: pointer; }
.filter-btn.active { background: #eee; color: #111; font-weight: bold; }
.section-divider { border: 0; border-top: 1px solid #222; margin: 30px 0; }

#productList { min-height: 500px; }
</style>
</head>
<body>

<header>
  <a href="#" class="logo">Derkerk</a>
  <nav>
    <a href="#">상품 관리</a>
    <a href="#">주문 관리</a>
    <a href="#">통계</a>
    <button onclick="alert('로그아웃')">로그아웃</button>
  </nav>
</header>

<main>
  <div id="categorySection" class="card">
    <h3>카테고리 관리</h3>
    <div class="category-control">
      <input id="newCategoryInput" type="text" placeholder="새 카테고리 입력" style="width: 200px;" onfocus="this.select()">
      <button onclick="addCategory()">추가</button>
      <div id="categoryList"></div>
    </div>
    <hr class="section-divider">
    <h3>하이라이트 카테고리 관리</h3>
    <div class="category-control">
      <input id="newHighlightInput" type="text" placeholder="하이라이트 입력" style="width: 200px;" onfocus="this.select()">
      <button onclick="addHighlight()">추가</button>
      <div id="highlightList"></div>
    </div>
  </div>

  <div id="productSection" class="card">
    <h3>상품 정보 등록</h3>
    <div class="input-row">
        <input id="productName" type="text" placeholder="상품명 입력" oninput="markChanged(); checkNameInput()" onfocus="this.select()">
        <input id="productPrice" type="number" class="price-input-unit" placeholder="정가" min="0" oninput="limitValues(this); calculateSalePrice(); markChanged()" onfocus="this.select()">
        <input id="discountRate" type="number" class="price-input-unit" placeholder="할인율(%)" min="0" max="100" oninput="limitValues(this); calculateSalePrice()" onfocus="this.select()">
        <div id="finalPriceDisplay" class="price-input-unit">0원</div>
    </div>

    <div id="dynamicDetails">
        <div style="margin-bottom:8px; font-size:0.9rem; color:#888; margin-top:20px;">일반 카테고리</div>
        <div id="categoryCheckboxGroup" class="category-checkbox-group"></div>
        
        <div style="margin-bottom:8px; font-size:0.9rem; color:#888;">하이라이트 카테고리</div>
        <div id="highlightCheckboxGroup" class="category-checkbox-group"></div>
        
        <textarea id="productDesc" placeholder="상품 설명을 입력하세요" oninput="markChanged()" onfocus="this.select()"></textarea>
        
        <div style="margin-top:15px;">
            <button onclick="document.getElementById('descImageUpload').click()" style="background:#444 !important; color:#fff !important;">상세페이지 이미지 추가</button>
            <input type="file" id="descImageUpload" multiple style="display:none;" onchange="uploadDescImages(event)">
            <div id="descImageList" style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; min-height: 80px;"></div>
        </div>
        
        <div class="save-area" style="margin-top:20px;">
            <button id="saveNameBtn" onclick="handleSaveWithDuplicateCheck()">Save Product</button>
        </div>
    </div>
    </div>

  <div class="card" id="editSection" style="display:none">
    <h3>색상 / 재고 설정</h3>
    <div class="color-control">
      <input id="colorInput" type="text" placeholder="색상명 입력" style="width: 150px;" onfocus="this.select()">
      <button onclick="addColor()">색상 추가</button>
      <div id="colorList"></div>
    </div>
    <div id="variantEditor" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
      <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
        <label style="font-size: 0.9rem;">사이즈 타입: 
          <select id="sizeType" onchange="changeSizeType(true)" style="width:auto;">
            <option value="standard">표준형 (S/M/L/XL)</option>
            <option value="doubleZero">00형 (44/55/66/77)</option>
            <option value="letter">영문형 (XS/S/M/L/XL)</option>
            <option value="custom">커스텀</option>
          </select>
        </label>
        <div id="customSizeControls" style="display:none; align-items:center; gap:8px;">
            <input type="text" id="customSizeName" placeholder="명칭" style="width:80px;" onfocus="this.select()">
            <button onclick="addCustomSizeItem()">추가</button>
        </div>
      </div>
      <table><thead><tr><th>Size</th><th>Stock</th><th>관리</th></tr></thead><tbody id="stockTable"></tbody></table>
      <div style="margin-top:20px;">
        <button onclick="document.getElementById('imageUpload').click()">사진 추가</button>
        <div id="imageList" style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; min-height: 80px;"></div>
      </div>
      <input type="file" id="imageUpload" multiple style="display:none;" onchange="uploadImages(event)">
      <div class="save-area" style="margin-top:20px;">
        <button onclick="saveProduct()">Save Product</button>
      </div>
    </div>
    <div class="save-area" style="display:none;"><button id="saveStockBtn" onclick="saveProduct()">Save Product</button></div>
  </div>

  <div class="card">
    <div class="list-header-row">
        <h3 style="margin: 0; white-space: nowrap;">등록된 상품 리스트</h3>
        <div class="search-box">
            <input type="text" id="productSearch" placeholder="상품명 검색..." oninput="renderProducts()" onfocus="this.select()" 
                   style="width: 100%; padding: 8px 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; outline: none;">
        </div>
    </div>
    <div id="filterArea" class="filter-group"></div>
    <div id="productList"></div>
  </div>
</main>

<script type="module" src="pdt.js"></script>

<script>
/**
 * 드래그 앤 드롭 및 초기화 로직
 */
function initDragAndDrop(listId, itemClass) {
    const list = document.getElementById(listId);
    if(!list) return;
    list.addEventListener('dragstart', e => {
        const item = e.target.closest('.' + itemClass);
        if (item) item.classList.add('dragging');
    });
    list.addEventListener('dragend', e => {
        const item = e.target.closest('.' + itemClass);
        if (item) item.classList.remove('dragging');
    });
    list.addEventListener('dragover', e => {
        e.preventDefault();
        const draggingItem = list.querySelector('.dragging');
        if (!draggingItem) return;
        const isVertical = listId === 'productList';
        const afterElement = getDragAfterElement(list, e.clientX, e.clientY, itemClass, isVertical);
        if (afterElement == null) { list.appendChild(draggingItem); } 
        else { list.insertBefore(draggingItem, afterElement); }
    });
}

function getDragAfterElement(container, x, y, itemClass, isVertical) {
    const draggableElements = [...container.querySelectorAll('.' + itemClass + ':not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = isVertical ? (y - box.top - box.height / 2) : (x - box.left - box.width / 2);
        if (offset < 0 && offset > closest.offset) { return { offset: offset, element: child }; } 
        else { return closest; }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

// [수정] 이미지 컨테이너도 드래그 가능 객체에 포함
setInterval(() => {
    document.querySelectorAll('.item-wrapper, .product-item, .image-container').forEach(el => {
        if (!el.getAttribute('draggable')) el.setAttribute('draggable', 'true');
    });
}, 500);

window.onload = () => {
    initDragAndDrop('categoryList', 'item-wrapper');
    initDragAndDrop('highlightList', 'item-wrapper');
    initDragAndDrop('colorList', 'item-wrapper');
    initDragAndDrop('productList', 'product-item');
    // [추가] 이미지 리스트 드래그앤드롭 활성화
    initDragAndDrop('imageList', 'image-container');
    initDragAndDrop('descImageList', 'image-container');

    if (typeof renderFilters === 'function') renderFilters();
    if (typeof renderCategories === 'function') renderCategories();
    if (typeof renderHighlights === 'function') renderHighlights();
};
</script>
</body>
</html>

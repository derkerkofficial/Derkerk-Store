<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Derkerk Admin - 상품관리</title>
    <style>
        /* 사장님 기존 스타일 그대로 유지 */
        :root { --bg: #111; --card: #1a1a1a; --text: #eee; --point: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin:0; padding:20px; padding-bottom:100px; }
        input, textarea, select, button { background:#222; color:#fff; border:1px solid #444; padding:12px; border-radius:8px; width:100%; box-sizing:border-box; margin-bottom:10px; font-size:16px; }
        button { background: var(--point); color: #000; font-weight: bold; cursor: pointer; border:none; }
        .product-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        #dynamicDetails { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s ease; }
        .image-container { display: inline-block; position: relative; margin-right: 5px; }
        .image-container img { border-radius: 4px; border: 1px solid #444; }
        .delete-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,0,0,0.5); color:white; display:flex; align-items:center; justify-content:center; font-size:10px; cursor:pointer; opacity:0; }
        .image-container:hover .delete-overlay { opacity:1; }
        .item-wrapper { display: inline-flex; align-items: center; background: #333; padding: 5px 10px; border-radius: 20px; margin: 3px; font-size: 14px; }
        .delete-x-btn { background:none; border:none; color:#ff4444; padding:0; margin-left:8px; width:auto; cursor:pointer; }
        .active { border: 2px solid #fff !important; }
    </style>
</head>
<body>

    <h2>상품 등록/수정</h2>
    
    <input type="text" id="productName" placeholder="상품명을 입력하세요" oninput="checkNameInput()">
    
    <div id="dynamicDetails">
        <input type="number" id="productPrice" placeholder="정가" oninput="calculateSalePrice(); limitValues(this)">
        <input type="number" id="discountRate" placeholder="할인율 (%)" oninput="calculateSalePrice(); limitValues(this)">
        <div id="finalPriceDisplay" style="color: #fff; font-weight: bold; margin-bottom: 15px;">0원</div>
        
        <textarea id="productDesc" placeholder="상품 설명을 입력하세요 (기능/소재 등)" rows="4"></textarea>

        <div style="margin-bottom:20px;">
            <h4>카테고리 선택</h4>
            <div id="categoryCheckboxGroup"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="newCategoryInput" placeholder="새 카테고리">
                <button onclick="addCategory()" style="width:80px;">추가</button>
            </div>
            <div id="categoryList"></div>
        </div>

        <div style="margin-bottom:20px;">
            <h4>하이라이트</h4>
            <div id="highlightCheckboxGroup"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="newHighlightInput" placeholder="새 하이라이트 (예: Best)">
                <button onclick="addHighlight()" style="width:80px;">추가</button>
            </div>
            <div id="highlightList"></div>
        </div>

        <div style="margin-bottom:20px;">
            <h4>상세 이미지 업로드</h4>
            <input type="file" multiple accept="image/*" onchange="uploadDescImages(event)">
            <div id="descImageList" style="margin-top:10px;"></div>
        </div>

        <div style="margin-bottom:20px; border:1px solid #333; padding:15px; border-radius:12px;">
            <h4>색상 및 사이즈별 재고</h4>
            <div style="display:flex; gap:5px;">
                <input type="text" id="colorInput" placeholder="색상명 (예: Black)">
                <button onclick="addColor()" style="width:80px;">추가</button>
            </div>
            <div id="colorList" style="margin:10px 0;"></div>

            <div id="variantEditor" style="display:none; background:#222; padding:15px; border-radius:8px;">
                <h5 id="editingColorName">색상 옵션 설정</h5>
                <select id="sizeType" onchange="changeSizeType(true)">
                    <option value="standard">기본 (S~XL)</option>
                    <option value="doubleZero">44~77</option>
                    <option value="letter">XS~XL</option>
                    <option value="custom">직접 입력</option>
                </select>

                <div id="customSizeControls" style="display:none; gap:5px; margin-bottom:10px;">
                    <input type="text" id="customSizeName" placeholder="사이즈명">
                    <button onclick="addCustomSizeItem()" style="width:80px;">추가</button>
                </div>

                <table style="width:100%; text-align:left;">
                    <thead><tr><th>사이즈</th><th>재고</th><th></th></tr></thead>
                    <tbody id="stockTable"></tbody>
                </table>

                <h5 style="margin-top:15px;">색상별 이미지</h5>
                <input type="file" multiple accept="image/*" onchange="uploadImages(event)">
                <div id="imageList" style="margin-top:10px;"></div>
            </div>
        </div>

        <button id="saveNameBtn" style="display:none; height:60px; font-size:18px; background:#fff; color:#000;" onclick="handleSaveWithDuplicateCheck()">서버에 저장하기</button>
        <button onclick="resetForm()" style="background:#333; margin-top:10px;">취소하기</button>
    </div>

    <hr style="border:0; border-top:1px solid #333; margin:40px 0;">

    <h3>등록된 상품 리스트</h3>
    <input type="text" id="productSearch" placeholder="상품명 검색..." oninput="renderProducts()">
    <div id="filterArea" style="margin-bottom:15px; overflow-x:auto; white-space:nowrap;"></div>
    <div id="productList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhPf0A4RBc4q8TV5FythPrRlsGA0Mspjc",
            authDomain: "derkerk-84352.firebaseapp.com",
            projectId: "derkerk-84352",
            storageBucket: "derkerk-84352.firebasestorage.app",
            messagingSenderId: "207773631707",
            appId: "1:207773631707:web:cb68d7c5173f1f48e4b8fe",
            measurementId: "G-2JFXG1HLKZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let categories = ['Outer', 'Top', 'Bottom', 'Dress', 'Acc'];
        let highlights = ['New', 'Best', 'Season Off'];
        let colors = [];
        let currentColor = null;
        let editingId = null;
        let currentFilter = 'All';
        let currentDescImages = [];

        const sizeOptions = { 
            standard: ['S','M','L','XL'], 
            doubleZero: ['44','55','66','77'], 
            letter: ['XS','S','M','L','XL']
        };

        // --- 서버 통신 ---
        async function load() {
            try {
                const q = query(collection(db, "products"), orderBy("updatedAt", "desc"));
                const snap = await getDocs(q);
                products = [];
                snap.forEach(d => products.push({...d.data(), firebaseUrl: d.id}));
                renderProducts();
                renderFilters();
                renderCategories();
                renderHighlights();
            } catch(e) { console.error(e); }
        }

        window.handleSaveWithDuplicateCheck = async function() {
            const name = document.getElementById('productName').value.trim();
            if(!name) return alert("이름 필수!");

            const data = {
                name,
                price: parseInt(document.getElementById('productPrice').value) || 0,
                discount: parseInt(document.getElementById('discountRate').value) || 0,
                desc: document.getElementById('productDesc').value,
                categories: Array.from(document.querySelectorAll('input[name="prodCat"]:checked')).map(c => c.value),
                highlights: Array.from(document.querySelectorAll('input[name="prodHigh"]:checked')).map(c => c.value),
                colors,
                descImages: currentDescImages,
                updatedAt: new Date()
            };

            try {
                if(editingId) {
                    await updateDoc(doc(db, "products", editingId), data);
                    alert("수정 완료");
                } else {
                    await addDoc(collection(db, "products"), data);
                    alert("저장 완료");
                }
                resetForm();
                load();
            } catch(e) { alert("실패: " + e.message); }
        };

        // --- UI 로직 ---
        window.checkNameInput = function() {
            const val = document.getElementById('productName').value;
            const area = document.getElementById('dynamicDetails');
            if(val.length > 0 || editingId) {
                area.style.maxHeight = "5000px"; area.style.opacity = "1";
                document.getElementById('saveNameBtn').style.display = 'block';
            }
        };

        window.calculateSalePrice = function() {
            const p = parseInt(document.getElementById('productPrice').value) || 0;
            const d = parseInt(document.getElementById('discountRate').value) || 0;
            document.getElementById('finalPriceDisplay').innerText = Math.floor(p * (1 - d/100)).toLocaleString() + "원";
        };

        window.addColor = function() {
            const name = document.getElementById('colorInput').value.trim();
            if(!name) return;
            colors.push({ name, sizeType: 'standard', stock: {S:0,M:0,L:0,XL:0}, images: [] });
            document.getElementById('colorInput').value = '';
            renderColors();
        };

        window.renderColors = function() {
            const list = document.getElementById('colorList');
            list.innerHTML = colors.map(c => `
                <div class="item-wrapper ${currentColor === c.name ? 'active' : ''}" onclick="selectColor('${c.name}')">
                    ${c.name} <button class="delete-x-btn" onclick="event.stopPropagation(); deleteColor('${c.name}')">✕</button>
                </div>
            `).join('');
        };

        window.selectColor = function(name) {
            currentColor = name;
            renderColors();
            const cData = colors.find(c => c.name === name);
            document.getElementById('variantEditor').style.display = 'block';
            document.getElementById('editingColorName').innerText = name + " 옵션 설정";
            document.getElementById('sizeType').value = cData.sizeType;
            changeSizeType(false);
            renderImages();
        };

        window.changeSizeType = function(clear) {
            const cData = colors.find(c => c.name === currentColor);
            const type = document.getElementById('sizeType').value;
            cData.sizeType = type;
            if(type === 'custom') {
                document.getElementById('customSizeControls').style.display = 'flex';
                if(clear) cData.stock = {};
            } else {
                document.getElementById('customSizeControls').style.display = 'none';
                if(clear) {
                    cData.stock = {};
                    sizeOptions[type].forEach(s => cData.stock[s] = 0);
                }
            }
            renderStockTable();
        };

        window.renderStockTable = function() {
            const tbody = document.getElementById('stockTable');
            const cData = colors.find(c => c.name === currentColor);
            tbody.innerHTML = Object.keys(cData.stock).map(s => `
                <tr>
                    <td>${s}</td>
                    <td><input type="number" value="${cData.stock[s]}" oninput="updateStock('${s}', this.value)" style="width:60px; margin:0; padding:5px;"></td>
                    <td><button onclick="deleteSize('${s}')" style="width:auto; padding:5px;">✕</button></td>
                </tr>
            `).join('');
        };

        window.updateStock = (size, val) => {
            const cData = colors.find(c => c.name === currentColor);
            cData.stock[size] = parseInt(val) || 0;
        };

        window.uploadImages = (e) => {
            const cData = colors.find(c => c.name === currentColor);
            Array.from(e.target.files).forEach(f => {
                const r = new FileReader();
                r.onload = (ev) => { cData.images.push(ev.target.result); renderImages(); };
                r.readAsDataURL(f);
            });
        };

        window.renderImages = () => {
            const list = document.getElementById('imageList');
            const cData = colors.find(c => c.name === currentColor);
            list.innerHTML = cData.images.map((img, i) => `
                <div class="image-container">
                    <img src="${img}" width="60">
                    <div class="delete-overlay" onclick="cData.images.splice(${i},1); renderImages();">삭제</div>
                </div>
            `).join('');
        };

        window.renderProducts = () => {
            const list = document.getElementById('productList');
            const search = document.getElementById('productSearch').value.toLowerCase();
            const filtered = products.filter(p => (currentFilter==='All' || p.categories.includes(currentFilter)) && p.name.toLowerCase().includes(search));
            list.innerHTML = filtered.map(p => `
                <div class="product-item">
                    <div onclick="editProduct('${p.firebaseUrl}')" style="cursor:pointer; flex:1;">
                        <strong>${p.name}</strong><br><small>${p.price.toLocaleString()}원</small>
                    </div>
                    <button onclick="deleteProduct('${p.firebaseUrl}')" style="width:60px; background:red; color:white;">삭제</button>
                </div>
            `).join('');
        };

        window.editProduct = (id) => {
            editingId = id;
            const p = products.find(x => x.firebaseUrl === id);
            document.getElementById('productName').value = p.name;
            document.getElementById('productPrice').value = p.price;
            document.getElementById('discountRate').value = p.discount;
            document.getElementById('productDesc').value = p.desc;
            colors = JSON.parse(JSON.stringify(p.colors || []));
            currentDescImages = p.descImages || [];
            checkNameInput();
            calculateSalePrice();
            renderColors();
            renderDescImageList();
            window.scrollTo(0,0);
        };

        window.deleteProduct = async (id) => {
            if(confirm("삭제할까요?")) { await deleteDoc(doc(db, "products", id)); load(); }
        };

        window.resetForm = () => { location.reload(); };

        // 초기 카테고리/하이라이트 렌더링
        window.renderCategories = () => {
            document.getElementById('categoryCheckboxGroup').innerHTML = categories.map(c => `<label style="margin-right:10px;"><input type="checkbox" name="prodCat" value="${c}"> ${c}</label>`).join('');
        };
        window.renderHighlights = () => {
            document.getElementById('highlightCheckboxGroup').innerHTML = highlights.map(h => `<label style="margin-right:10px;"><input type="checkbox" name="prodHigh" value="${h}"> ${h}</label>`).join('');
        };
        window.renderFilters = () => {
            document.getElementById('filterArea').innerHTML = `<button onclick="currentFilter='All'; renderProducts();" style="width:auto; margin-right:5px;">All</button>` + 
                categories.map(c => `<button onclick="currentFilter='${c}'; renderProducts();" style="width:auto; margin-right:5px;">${c}</button>`).join('');
        };
        window.uploadDescImages = (e) => {
            Array.from(e.target.files).forEach(f => {
                const r = new FileReader();
                r.onload = (ev) => { currentDescImages.push(ev.target.result); renderDescImageList(); };
                r.readAsDataURL(f);
            });
        };
        window.renderDescImageList = () => {
            document.getElementById('descImageList').innerHTML = currentDescImages.map((img, i) => `
                <div class="image-container"><img src="${img}" width="80"><div class="delete-overlay" onclick="currentDescImages.splice(${i},1); renderDescImageList();">삭제</div></div>
            `).join('');
        };

        window.onload = load;
    </script>
</body>
</html>
